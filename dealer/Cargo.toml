[package]
name = "lockbox-key-import"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "lockbox_key_import"
path = "src/lib.rs"

[[bin]]
name = "lockbox-key-import-dealer"
path = "src/bin/lockbox-key-import-dealer.rs"
required-features = ["dealer"]

[features]
default = ["dealer"]
dealer = ["cggmp21/spof", "dep:rpassword"]

[dependencies]
cggmp21 = { version = "=0.6.3", default-features = false, features = ["curve-secp256k1"] }
generic-ec = { version = "0.4", default-features = false, features = ["curve-secp256k1", "serde"] }
p256 = { version = "0.13", features = ["ecdh", "pkcs8", "pem"] }
x509-cert = { version = "0.2", features = ["pem"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
rpassword = { version = "7", optional = true }

[profile.release]
opt-level = 3
