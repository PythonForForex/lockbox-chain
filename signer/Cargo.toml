[package]
name = "lockbox-signer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "lockbox-signer"
path = "src/main.rs"

[dependencies]
cggmp21 = { version = "=0.6.3", default-features = false, features = ["curve-secp256k1"] }
generic-ec = { version = "0.4", default-features = false, features = ["curve-secp256k1", "serde"] }
round-based = { version = "0.4", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
base64 = "0.22"
rust_decimal = "1"
p256 = "0.13"
lockbox-key-import = { path = "../dealer", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service", "http1"] }

[profile.release]
opt-level = 3
